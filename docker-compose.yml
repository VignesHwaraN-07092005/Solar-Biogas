version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solar_biogas_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./solar_biogas.db
      - SYSTEM_MODE=DEMO
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solar_biogas_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
